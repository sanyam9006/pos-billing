<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperMart Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #FAF7F2;
  --bg2: #FFFFFF;
  --bg3: #FAF7F2;
  --bg4: #FFFFFF;
  --bgh: #F7F3EC;
  --acc: #5B9BD5;
  --accl: #5B9BD5;
  --accg: rgba(91,155,213,.18);
  --acc2: #C9A227;
  --ok: #2E7D32;
  --okg: rgba(46,125,50,.1);
  --warn: #C9A227;
  --warng: rgba(201,162,39,.12);
  --err: #D32F2F;
  --errg: rgba(211,47,47,.1);
  --info: #5B9BD5;
  --infog: rgba(91,155,213,.12);
  --t1: #2B2622;
  --t2: #7A7168;
  --t3: #9E958A;
  --brd: #EDE7DD;
  --rad: 10px;
  --sh: 0 4px 20px rgba(43,38,34,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#DFD7CC;border-radius:3px}
button{font-family:inherit;cursor:pointer;border:none}
input,select{font-family:inherit;background:var(--bg4);border:1.5px solid var(--brd);border-radius:8px;color:var(--t1);padding:10px 14px;font-size:13px;outline:none;transition:all .2s ease}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accg)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t2);padding:11px 14px;text-align:left;background:var(--bg3);border-bottom:1.5px solid var(--brd)}
td{padding:11px 14px;border-bottom:1px solid var(--brd);font-size:13px}
tbody tr:hover{background:var(--bgh)}

/* LAYOUT */
.app{display:flex;height:100vh}
.sidebar{width:240px;background:var(--bg2);border-right:1px solid var(--brd);display:flex;flex-direction:column;flex-shrink:0}
.side-logo{padding:20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--brd)}
.side-logo span{font-size:22px}
.side-logo h2{font-size:16px;font-weight:800;color:var(--t1)}
.side-nav{padding:12px;flex:1}
.nav-section{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t2);padding:14px 12px 6px;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--t2);font-size:13px;font-weight:600;transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:var(--bgh);color:var(--t1)}
.nav-item.active{background:#A8CDE8;color:var(--t1);font-weight:700}
.nav-item .icon{font-size:17px;width:22px;text-align:center}
.side-footer{padding:16px;border-top:1px solid var(--brd);font-size:11px;color:var(--t2)}
.side-footer a{color:var(--acc);text-decoration:none;font-weight:600}

/* MAIN CONTENT */
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--bg2);border-bottom:1px solid var(--brd);box-shadow:0 1px 3px rgba(43,38,34,.05)}
.top-bar h1{font-size:20px;font-weight:800;color:var(--t1)}
.top-bar .info{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--t2)}
.top-bar .admin-badge{background:var(--bg);border:1px solid var(--brd);color:var(--t1);padding:4px 12px;border-radius:16px;font-size:11px;font-weight:700}
.content{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
.page{display:none}.page.active{display:block}

/* DASHBOARD CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rad);padding:20px;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(43,38,34,.05)}
.stat-card::after{content:'';position:absolute;top:0;right:0;width:80px;height:80px;border-radius:0 0 0 80px;opacity:.08}
.stat-card.revenue::after{background:var(--ok)}.stat-card.orders::after{background:var(--info)}
.stat-card.avg::after{background:var(--acc)}.stat-card.items::after{background:var(--warn)}
.stat-card .label{font-size:12px;color:var(--t2);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.stat-card .value{font-size:28px;font-weight:800;margin:6px 0 2px;font-family:'JetBrains Mono',monospace;color:var(--t1)}
.stat-card .change{font-size:11px;font-weight:700}
.stat-card .change.up{color:var(--ok)}.stat-card .change.down{color:var(--err)}
.stat-card .icon{font-size:28px;position:absolute;right:16px;top:16px;opacity:.25}

/* CHART PLACEHOLDER */
.chart-row{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:24px}
.chart-card{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rad);padding:20px;box-shadow:0 1px 4px rgba(43,38,34,.05)}
.chart-card h3{font-size:14px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--t1)}
.chart-card h3 span{font-size:16px}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding-top:10px}
.bar{flex:1;background:var(--acc);border-radius:6px 6px 0 0;position:relative;min-height:8px;transition:height .5s ease}
.bar:hover{background:#4582BD}
.bar .bar-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--t2);white-space:nowrap;font-weight:600}
.bar .bar-val{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--t1);font-family:'JetBrains Mono',monospace;font-weight:700}
.pie-list{display:flex;flex-direction:column;gap:10px}
.pie-item{display:flex;align-items:center;gap:10px}
.pie-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pie-item .name{flex:1;font-size:13px;font-weight:500;color:var(--t1)}.pie-item .val{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--t1)}
.pie-bar{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin:0 8px}
.pie-bar .fill{height:100%;border-radius:3px}

/* TOP PRODUCTS */
.top-products{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.tp-card{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rad);padding:20px;box-shadow:0 1px 4px rgba(43,38,34,.05)}
.tp-card h3{font-size:14px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--t1)}
.tp-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--brd)}
.tp-item:last-child{border-bottom:none}
.tp-item .rank{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;margin-right:10px;flex-shrink:0}
.tp-item .rank.r1{background:rgba(201,162,39,.18);color:#9B7B16}.tp-item .rank.r2{background:rgba(122,113,104,.18);color:#524A42}.tp-item .rank.r3{background:rgba(91,155,213,.2);color:#356D9C}
.tp-item .rank.r4,.tp-item .rank.r5{background:var(--bg3);color:var(--t2)}
.tp-item .nm{flex:1;font-size:13px;font-weight:600;color:var(--t1)}.tp-item .vl{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--acc2)}

/* TABLE CARD */
.table-card{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rad);overflow:hidden;margin-bottom:24px;box-shadow:0 1px 4px rgba(43,38,34,.05)}
.table-card .tc-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--brd)}
.table-card .tc-header h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--t1)}
.tc-actions{display:flex;gap:8px}
.tc-btn{padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;background:var(--bg);color:var(--t1);border:1px solid var(--brd);transition:all .15s}
.tc-btn:hover{background:var(--bgh)}
.tc-btn.primary{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 2px 8px rgba(91,155,213,.3)}
.tc-btn.primary:hover{background:#4582BD}
.tc-search{padding:7px 12px;border-radius:6px;font-size:12px;width:200px;background:var(--bg);border:1px solid var(--brd)}
.status-badge{padding:3px 10px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase}
.status-badge.active{background:var(--okg);color:var(--ok)}
.status-badge.inactive{background:var(--errg);color:var(--err)}
.status-badge.low{background:var(--warng);color:var(--warn)}

/* ALERTS */
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg3);border-radius:8px;font-size:12px;border-left:3px solid;border:1px solid var(--brd);border-left-width:3px}
.alert-item.warn{border-left-color:var(--warn)}.alert-item.err{border-left-color:var(--err)}.alert-item.info{border-left-color:var(--info)}
.alert-item .at{color:var(--t2);margin-left:auto;font-size:10px;white-space:nowrap}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(43,38,34,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;padding:28px;width:480px;box-shadow:var(--sh);animation:mu .2s ease}
@keyframes mu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.modal h2{font-size:18px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:8px;color:var(--t1)}
.modal .mc{margin-left:auto;background:none;border:none;color:var(--t2);font-size:18px;cursor:pointer;padding:4px 8px}
.modal .fg{margin-bottom:14px}
.modal .fg label{display:block;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.modal .fg input,.modal .fg select{width:100%}
.modal .fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.mbtn{padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.mbtn.pri{background:var(--acc);color:#fff;box-shadow:0 2px 8px rgba(91,155,213,.3)}.mbtn.pri:hover{background:#4582BD}
.mbtn.sec{background:var(--bg);color:var(--t1);border:1px solid var(--brd)}

/* SETTINGS FORM */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.set-card{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rad);padding:24px;box-shadow:0 1px 4px rgba(43,38,34,.05)}
.set-card h3{font-size:14px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:8px;color:var(--t1)}
.sfg{margin-bottom:16px}
.sfg label{display:block;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.sfg input,.sfg select{width:100%;padding:11px 14px;font-size:13px}
.sfg-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sfg-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.sfg .inp-group{display:flex;gap:8px}
.sfg .inp-group input{flex:1}
.sfg .inp-group button{flex-shrink:0;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:700;background:var(--acc);color:#fff}
.sfg .hint{font-size:10px;color:var(--t2);margin-top:4px}
.gst-ok{color:var(--ok);font-size:12px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:4px}
.gst-err{color:var(--err);font-size:12px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:4px}

/* TABS */
.tab-bar{display:flex;gap:4px;background:var(--bg3);border:1px solid var(--brd);border-radius:8px;padding:3px}
.tab-btn{padding:8px 18px;border-radius:6px;font-size:12px;font-weight:600;background:none;color:var(--t2);transition:all .15s}
.tab-btn:hover{color:var(--t1)}
.tab-btn.active{background:var(--bg2);color:var(--t1);font-weight:700;box-shadow:0 1px 3px rgba(43,38,34,.1)}
.sync-bar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--bg3);border-radius:8px;margin-bottom:16px;font-size:12px}
.sync-dot{width:8px;height:8px;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-dot.live{background:var(--ok)}
.sync-dot.off{background:var(--err);animation:none}
.time-picker{display:flex;align-items:center;gap:8px;font-size:12px}
.time-picker input{padding:6px 10px;font-size:11px;width:130px}
.time-picker span{color:var(--t3)}

/* GST BADGE */
.gst-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace}
.gst-badge.g0{background:rgba(148,163,184,.15);color:#94a3b8}
.gst-badge.g5{background:rgba(0,184,148,.15);color:var(--ok)}
.gst-badge.g12{background:rgba(253,203,110,.15);color:var(--warn)}
.gst-badge.g18{background:rgba(225,112,85,.15);color:var(--err)}
.gst-badge.g28{background:rgba(162,155,254,.15);color:var(--accl)}
.gst-actions{display:flex;gap:4px}
</style>
</head>
<body>
<div class="app">
<!-- SIDEBAR -->
<aside class="sidebar">
<div class="side-logo"><span>🏪</span><h2>SuperMart</h2></div>
<nav class="side-nav">
<div class="nav-section">Main</div>
<div class="nav-item active" onclick="showPage('dashboard',this)"><span class="icon">📊</span>Dashboard</div>
<div class="nav-item" onclick="showPage('sales',this)"><span class="icon">💰</span>Sales Reports</div>
<div class="nav-section">Management</div>
<div class="nav-item" onclick="showPage('inventory',this)"><span class="icon">📦</span>Inventory</div>
<div class="nav-item" onclick="showPage('employees',this)"><span class="icon">👥</span>Employees</div>
<div class="nav-item" onclick="showPage('customers',this)"><span class="icon">❤️</span>Customers</div>
<div class="nav-section">Settings</div>
<div class="nav-item" onclick="showPage('coupons',this)"><span class="icon">🏷️</span>Coupons</div>
<div class="nav-item" onclick="showPage('settings',this)"><span class="icon">⚙️</span>Settings</div>
</nav>
<div class="side-footer">SuperMart POS v1.0<br><a href="supermart_pos.html">← Back to POS</a></div>
</aside>

<!-- MAIN -->
<div class="main-content">
<header class="top-bar">
<h1 id="pageTitle">📊 Dashboard</h1>
<div class="info"><span class="admin-badge">👑 Admin</span><span>📅 <span id="topDate"></span></span><span>🕐 <span id="topClock"></span></span></div>
</header>
<div class="content" id="contentArea"></div>
</div>
</div>

<script>
// ════════════════════════════════
// DATABASE & PERSISTENCE
// ════════════════════════════════
const STORAGE_KEY = 'SUPERMART_DATA_V1';
const DB = {
  products: [
    {id:1,sku:'GRC001',barcode:'8901030793394',name:'Tata Salt 1kg',category:'Groceries',mrp:28,selling_price:28,tax_rate:5,stock_qty:200,reorder:50,status:'active'},
    {id:2,sku:'GRC002',barcode:'8901030793400',name:'Fortune Sunflower Oil 1L',category:'Groceries',mrp:185,selling_price:175,tax_rate:5,stock_qty:80,reorder:20,status:'active'},
    {id:3,sku:'GRC003',barcode:'8901030793401',name:'Aashirvaad Atta 5kg',category:'Groceries',mrp:295,selling_price:280,tax_rate:5,stock_qty:60,reorder:15,status:'active'},
    {id:4,sku:'GRC004',barcode:'8901030793402',name:'Tata Chana Dal 1kg',category:'Groceries',mrp:160,selling_price:152,tax_rate:5,stock_qty:8,reorder:20,status:'active'},
    {id:5,sku:'GRC005',barcode:'8901030793403',name:'India Gate Basmati Rice 1kg',category:'Groceries',mrp:180,selling_price:170,tax_rate:5,stock_qty:90,reorder:25,status:'active'},
    {id:15,sku:'HHL001',barcode:'8901030793450',name:'Vim Dishwash Bar 200g',category:'Household',mrp:32,selling_price:30,tax_rate:18,stock_qty:0,reorder:40,status:'active'}
  ],
  cashiers: [
    {id:1,name:'Rahul Sharma',employee_code:'EMP001',pin:'1234',role:'cashier'},
    {id:2,name:'Priya Patel',employee_code:'EMP002',pin:'5678',role:'cashier'}
  ],
  customers: [
    {id:1,name:'Ananya Iyer',phone:'9876543210',email:'ananya@email.com',loyalty_points:342,membership_tier:'Gold',visits:28,total_spent:45200},
    {id:2,name:'Vikram Singh',phone:'9876543211',email:'vikram@email.com',loyalty_points:150,membership_tier:'Silver',visits:12,total_spent:18500}
  ],
  coupons: [
    {id:1,code:'SAVE10',type:'percent',value:10,min_bill:500,max_discount:200,used:42,status:'active'},
    {id:2,code:'FLAT50',type:'flat',value:50,min_bill:300,max_discount:null,used:28,status:'active'}
  ],
  sales: [],
  txnCounter: 0,
  heldBills: []
};

// Map legacy names for compatibility with existing render functions
let PRODUCTS = DB.products;
let EMPLOYEES = DB.cashiers; // Code uses EMPLOYEES in some places, cashiers in others
let CUSTOMERS = DB.customers;
let COUPONS = DB.coupons;
let SALES_HISTORY = DB.sales;

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      Object.assign(DB, data);
      // Re-map after loading
      PRODUCTS = DB.products;
      EMPLOYEES = DB.cashiers;
      CUSTOMERS = DB.customers;
      COUPONS = DB.coupons;
      SALES_HISTORY = DB.sales;
    }
  } catch (e) {
    console.error('Failed to load data:', e);
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  } catch (e) {
    console.error('Failed to save data:', e);
    alert('💾 Storage Error: Browser storage full? Data might not be saved.');
  }
}

loadData();

const SALES_DATA={hours:[320,180,450,680,920,1100,1350,1280,980,1450,1620,1200],
labels:['6AM','7AM','8AM','9AM','10AM','11AM','12PM','1PM','2PM','3PM','4PM','5PM'],
payment:{cash:42,card:31,upi:24,split:3},
daily:[{date:'28 Mar',revenue:28450,txns:94,avg:302},{date:'27 Mar',revenue:32100,txns:108,avg:297},{date:'26 Mar',revenue:26800,txns:89,avg:301},{date:'25 Mar',revenue:31500,txns:105,avg:300},{date:'24 Mar',revenue:29200,txns:96,avg:304},{date:'23 Mar',revenue:27600,txns:92,avg:300},{date:'22 Mar',revenue:24800,txns:82,avg:302}],
topSellers:[{name:'Amul Butter 500g',qty:45,rev:12150},{name:'Maggi 4-Pack',qty:38,rev:1976},{name:'Fortune Oil 1L',qty:32,rev:5600},{name:'Tata Salt 1kg',qty:28,rev:784},{name:'Coca-Cola 750ml',qty:26,rev:988}]
};

const fp = n => '₹' + (n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fpk = n => n>=1000?'₹'+(n/1000).toFixed(1)+'K':fp(n);
let modalEl = null;

// Clock
function updateClock(){
  const d=new Date();
  const de=document.getElementById('topDate'),cl=document.getElementById('topClock');
  if(de)de.textContent=d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  if(cl)cl.textContent=d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock,1000);updateClock();

// Nav
function showPage(page,el){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el)el.classList.add('active');
  const titles={dashboard:'📊 Dashboard',sales:'💰 Sales Reports',inventory:'📦 Inventory Management',employees:'👥 Employee Management',customers:'❤️ Customer & Loyalty',coupons:'🏷️ Coupon Management',settings:'⚙️ Settings'};
  document.getElementById('pageTitle').textContent=titles[page]||page;
  const area=document.getElementById('contentArea');
  const renderers={dashboard:renderDashboard,sales:renderSales,inventory:renderInventory,employees:renderEmployees,customers:renderCustomers,coupons:renderCoupons,settings:renderSettings};
  area.innerHTML=(renderers[page]||renderDashboard)();
}

// ════════════ DASHBOARD ════════════
function renderDashboard(){
  const lowStock=PRODUCTS.filter(p=>p.stock_qty<=p.reorder);
  const outOfStock=PRODUCTS.filter(p=>p.stock_qty===0);
  return `
  <div class="stats-grid">

function switchSalesView(v){salesView=v;showPage('sales',document.querySelector('.nav-item.active'));}
function toggleSync(){autoSync=!autoSync;if(autoSync){startSync();}else{clearInterval(syncTimer);syncTimer=null;}showPage('sales',document.querySelector('.nav-item.active'));}
function manualSync(){showPage('sales',document.querySelector('.nav-item.active'));}
function startSync(){if(syncTimer)clearInterval(syncTimer);syncTimer=setInterval(()=>{if(document.getElementById('contentArea').innerHTML.includes('Live Sync'))showPage('sales',document.querySelector('.nav-item.active'));},30000);}

function showGSTEditModal(id){
  const p=PRODUCTS.find(x=>x.id===id);
  if(!p)return;
  const m=document.createElement('div');m.className='modal-bg';m.onclick=e=>{if(e.target===m)m.remove()};
  m.innerHTML=`<div class="modal"><h2>🏛️ Edit GST — ${p.name}<button class="mc" onclick="this.closest('.modal-bg').remove()">✕</button></h2>
    <div style="background:var(--bg4);border-radius:8px;padding:14px;margin-bottom:16px">
      <div style="font-size:11px;color:var(--t3);margin-bottom:6px">CURRENT GST RATE</div>
      <span class="gst-badge ${gstClass(p.tax_rate)}" style="font-size:16px;padding:6px 14px">${p.tax_rate}% GST</span>
    </div>
    <div class="fg"><label>New GST Rate</label>
      <select id="newGstRate" style="width:100%;padding:12px">
        <option value="0" ${p.tax_rate===0?'selected':''}>0% — Exempt (Milk, Fresh Vegetables, etc.)</option>
        <option value="5" ${p.tax_rate===5?'selected':''}>5% — Essential Goods (Salt, Oil, Spices, etc.)</option>
        <option value="12" ${p.tax_rate===12?'selected':''}>12% — Standard (Butter, Processed Food, etc.)</option>
        <option value="18" ${p.tax_rate===18?'selected':''}>18% — Higher (Beverages, Personal Care, etc.)</option>
        <option value="28" ${p.tax_rate===28?'selected':''}>28% — Luxury Items</option>
      </select>
    </div>
    <div class="fg" style="margin-top:12px"><label>HSN Code (optional)</label><input placeholder="e.g. 2501 for Salt" style="width:100%"></div>
    <div style="background:var(--warng);border-radius:8px;padding:10px 14px;margin-top:12px;font-size:11px;color:var(--warn)">⚠️ Changing GST will apply to all future bills. Existing bills are not affected.</div>
    <div class="macts"><button class="mbtn sec" onclick="this.closest('.modal-bg').remove()">Cancel</button>
    <button class="mbtn" style="background:var(--err);color:#fff" onclick="updateProductGST(${p.id},0);this.closest('.modal-bg').remove()">❌ Remove GST</button>
    <button class="mbtn pri" onclick="updateProductGST(${p.id},parseInt(document.getElementById('newGstRate').value));this.closest('.modal-bg').remove()">💾 Update GST</button></div></div>`;
  document.body.appendChild(m);
}

function updateProductGST(id,rate){
  const p=PRODUCTS.find(x=>x.id===id);
  if(p){p.tax_rate=rate;saveData();}
  showPage('inventory',document.querySelector('.nav-item.active'));
}

function removeAllGST(){
  if(!confirm('⚠️ Remove GST from ALL products? This will set all tax rates to 0%.'))return;
  PRODUCTS.forEach(p=>p.tax_rate=0);saveData();
  showPage('inventory',document.querySelector('.nav-item.active'));
}

function showBulkGSTModal(){
  const cats=[...new Set(PRODUCTS.map(p=>p.category))].sort();
  const m=document.createElement('div');m.className='modal-bg';m.onclick=e=>{if(e.target===m)m.remove()};
  m.innerHTML=`<div class="modal"><h2>📋 Bulk Update GST<button class="mc" onclick="this.closest('.modal-bg').remove()">✕</button></h2>
    <div class="fg"><label>Apply to Category</label><select id="bulkCat" style="width:100%"><option value="ALL">All Products</option>${cats.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
    <div class="fg"><label>Set GST Rate</label><select id="bulkRate" style="width:100%">
      <option value="0">0% — Exempt</option><option value="5" selected>5% — Essential</option><option value="12">12% — Standard</option><option value="18">18% — Higher</option><option value="28">28% — Luxury</option>
    </select></div>
    <div style="background:var(--infog);border-radius:8px;padding:10px 14px;margin-top:8px;font-size:11px;color:var(--info)">ℹ️ This will update GST for all products in the selected category.</div>
    <div class="macts"><button class="mbtn sec" onclick="this.closest('.modal-bg').remove()">Cancel</button>
    <button class="mbtn pri" onclick="bulkUpdateGST();this.closest('.modal-bg').remove()">💾 Apply to All</button></div></div>`;
  document.body.appendChild(m);
}

function bulkUpdateGST(){
  const cat=document.getElementById('bulkCat').value;
  const rate=parseInt(document.getElementById('bulkRate').value);
  PRODUCTS.forEach(p=>{if(cat==='ALL'||p.category===cat)p.tax_rate=rate;});saveData();
  showPage('inventory',document.querySelector('.nav-item.active'));
}

function validateGST(){
  const inp=document.getElementById('gstIn');
  const st=document.getElementById('gstStatus');
  const val=inp.value.trim();
  const gstRegex=/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$/;
  if(!val){st.innerHTML='<div class="gst-err">❌ GSTIN cannot be empty</div>';return;}
  if(val.length!==15){st.innerHTML='<div class="gst-err">❌ GSTIN must be exactly 15 characters (currently '+val.length+')</div>';return;}
  if(!gstRegex.test(val)){st.innerHTML='<div class="gst-err">❌ Invalid GSTIN format. Check the pattern above.</div>';return;}
  const stateCode=parseInt(val.substring(0,2));
  if(stateCode<1||stateCode>37){st.innerHTML='<div class="gst-err">❌ Invalid state code: '+val.substring(0,2)+'</div>';return;}
  st.innerHTML='<div class="gst-ok">✅ Valid GSTIN — State: '+getStateName(stateCode)+' | PAN: '+val.substring(2,12)+'</div>';
}

function editGST(){
  const inp=document.getElementById('gstIn');
  inp.removeAttribute('readonly');
  inp.focus();
  inp.select();
  document.getElementById('gstStatus').innerHTML='<div style="color:var(--info);font-size:11px;margin-top:4px">✏️ Editing — type the new GSTIN, then click Verify to validate</div>';
}

function filterInventory(q){
  const rows=document.getElementById('invTable').querySelectorAll('tr');
  rows.forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none'});
}

function exportData() {
  const data = JSON.stringify(DB, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `supermart_backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (confirm('⚠️ This will overwrite all CURRENT data with the backup file. Continue?')) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          location.reload();
        }
      } catch (err) {
        alert('❌ Invalid backup file.');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetStorage() {
  if (confirm('🚨 DANGER: This will delete ALL products, sales, and settings. This cannot be undone. Are you sure?')) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}
