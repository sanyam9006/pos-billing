<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperMart POS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #FAF7F2;
  --bg2: #FFFFFF;
  --bg3: #FAF7F2;
  --bg4: #FFFFFF;
  --bgh: #F7F3EC;
  --acc: #5B9BD5;
  --accl: #5B9BD5;
  --accg: rgba(91,155,213,.2);
  --acc2: #C9A227;
  --ok: #2E7D32;
  --warn: #C9A227;
  --err: #D32F2F;
  --t1: #2B2622;
  --t2: #7A7168;
  --t3: #9E958A;
  --brd: #EDE7DD;
  --rad: 10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#DFD7CC;border-radius:3px}
input{width:100%;padding:12px 14px;background:var(--bg4);border:1.5px solid var(--brd);border-radius:var(--rad);color:var(--t1);font-size:15px;font-family:inherit;outline:none;transition:all .2s ease}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accg)}
button{font-family:inherit;cursor:pointer}

/* LOGIN */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%, #FFFFFF 0%, #FAF7F2 60%, #F3ECE1 100%)}
.login-card{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;padding:44px 36px;width:400px;box-shadow:0 12px 36px rgba(43,38,34,.1)}
.login-card h1{text-align:center;font-size:24px;font-weight:800;color:var(--t1);margin-bottom:6px}
.login-card .sub{text-align:center;color:var(--t2);font-size:13px;margin-bottom:28px}
.login-card label{display:block;font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin:0 0 5px}
.login-card .fg{margin-bottom:16px}
.login-card .btn{width:100%;padding:14px;background:var(--acc);color:#fff;border:none;border-radius:var(--rad);font-size:15px;font-weight:700;margin-top:8px;box-shadow:0 4px 14px rgba(91,155,213,.35);transition:all .2s}
.login-card .btn:hover{background:#4582BD;box-shadow:0 6px 18px rgba(91,155,213,.45)}
.login-card .hint{text-align:center;margin-top:18px;font-size:12px;color:var(--t2);border-top:1px solid var(--brd);padding-top:14px}
.login-card .hint code{background:var(--bg);border:1px solid var(--brd);padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;color:var(--t1);font-weight:600}
.lerr{background:#FDF0F0;border:1px solid rgba(220,38,38,.2);color:var(--err);padding:10px;border-radius:6px;font-size:13px;text-align:center;margin-bottom:14px;font-weight:600}

/* BILLING LAYOUT */
.billing{display:flex;flex-direction:column;height:100vh}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--brd);box-shadow:0 1px 3px rgba(43,38,34,.05)}
.hdr .logo{font-size:18px;font-weight:800;color:var(--t1)}
.hdr .info{display:flex;gap:20px;font-size:13px;color:var(--t2)}
.hdr .info b{color:var(--t1);font-weight:700}
.hdr .badge{background:var(--bg);border:1px solid var(--brd);color:var(--t1);padding:4px 12px;border-radius:16px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace}
.hdr .logbtn{background:var(--bg);border:1px solid var(--brd);color:var(--t2);padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;margin-left:8px;transition:all .2s}
.hdr .logbtn:hover{background:#FDF0F0;color:var(--err);border-color:rgba(220,38,38,.3)}
.main{display:flex;flex:1;overflow:hidden}

/* CART SECTION */
.cart-sec{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--brd);background:var(--bg2)}
.scan-bar{display:flex;gap:8px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--brd);position:relative}
.scan-bar input{padding-left:38px;font-family:'JetBrains Mono',monospace}
.scan-bar .si{position:absolute;left:26px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--t2)}
.scan-bar .abtn{padding:10px 20px;background:var(--acc);color:#fff;border:none;border-radius:var(--rad);font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(91,155,213,.3);transition:all .2s}
.scan-bar .abtn:hover{background:#4582BD}
.cart-list{flex:1;overflow-y:auto;background:var(--bg2)}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--t2);gap:10px}
.cart-empty span{font-size:56px;opacity:.35}
table.ct{width:100%;border-collapse:collapse}
.ct th{background:var(--bg);color:var(--t2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;text-align:left;border-bottom:1.5px solid var(--brd);position:sticky;top:0;z-index:5}
.ct td{padding:10px 12px;border-bottom:1px solid var(--brd);font-size:13px}
.ct tbody tr:hover{background:var(--bgh)}
.ct .nm{font-weight:700;color:var(--t1)}.ct .mt{font-size:11px;color:var(--t2);margin-top:2px}
.ct .pr{font-family:'JetBrains Mono',monospace;font-weight:600;text-align:right}
.ct .lt{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--t1);text-align:right;font-size:14px}
.qc{display:flex;align-items:center;justify-content:center}
.qc button{width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--brd);color:var(--t1);font-size:13px;font-weight:700}
.qc button:first-child{border-radius:5px 0 0 5px}.qc button:last-child{border-radius:0 5px 5px 0}
.qc button:hover{background:#A8CDE8;border-color:var(--acc);color:var(--t1)}
.qc span{width:32px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border-top:1px solid var(--brd);border-bottom:1px solid var(--brd);font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace}
.vbtn{background:none;border:none;color:var(--t2);font-size:15px;padding:3px 6px;border-radius:4px}
.vbtn:hover{background:#FDF0F0;color:var(--err)}

/* TOTALS */
.totals{background:var(--bg);border-top:1.5px solid var(--brd);padding:14px 20px}
.trow{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
.trow .l{color:var(--t2);font-weight:500}.trow .a{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--t1)}
.trow.disc .a{color:var(--ok);font-weight:700}.trow.tax .l{font-size:12px}
.tdiv{border:none;border-top:1px dashed var(--brd);margin:8px 0}
.trow.gt .l{font-size:15px;font-weight:800;color:var(--t1)}
.trow.gt .a{font-size:24px;font-weight:800;color:var(--acc2)}
.icnt{font-size:12px;color:var(--t2);margin-top:4px;font-weight:500}

/* ACTION PANEL */
.act-panel{width:320px;display:flex;flex-direction:column;background:var(--bg)}
.act-btns{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.abtn2{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rad);color:var(--t2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;box-shadow:0 1px 3px rgba(43,38,34,.05);transition:all .2s}
.abtn2:hover{background:#A8CDE8;color:var(--t1);border-color:var(--acc);transform:translateY(-1px)}
.abtn2 .i{font-size:22px}
.cust-disp{margin:0 12px 10px;padding:12px;background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rad);box-shadow:0 1px 3px rgba(43,38,34,.05)}
.cust-disp .cn{font-weight:700;font-size:13px;color:var(--t1)}.cust-disp .cp{font-size:12px;color:var(--t2);margin-top:2px}
.cust-disp .cp b{color:var(--ok);font-family:'JetBrains Mono',monospace;font-weight:700}
.coup-disp{margin:0 12px 10px;padding:10px 12px;background:#EAF4EC;border:1px solid rgba(46,125,50,.25);border-radius:6px;display:flex;justify-content:space-between;font-size:12px;color:var(--t1)}
.coup-disp .cc{font-weight:800;color:var(--ok);font-family:'JetBrains Mono',monospace}

/* PAYMENT BUTTONS */
.pay-sec{margin-top:auto;padding:12px;border-top:1px solid var(--brd);background:var(--bg2)}
.pay-sec h3{font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;font-weight:700}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;border:none;border-radius:var(--rad);font-size:14px;font-weight:700;color:#fff;transition:all .2s}
.pbtn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(43,38,34,.15)}
.pbtn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.pbtn.ca{background:#2E7D32}.pbtn.cd{background:#5B9BD5}
.pbtn.up{background:#7C5CBF}.pbtn.sp{background:#C9A227}

/* MODAL */
.mov{position:fixed;inset:0;background:rgba(43,38,34,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000}
.mod{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;padding:26px;min-width:380px;max-width:480px;box-shadow:0 12px 36px rgba(43,38,34,.12);animation:su .2s ease}
@keyframes su{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.mod h2{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--t1)}
.mod .mc{margin-left:auto;background:none;border:none;color:var(--t2);font-size:18px;cursor:pointer;padding:4px 8px}
.mod .fg{margin-bottom:14px}
.mod .fg label{display:block;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.mbtn{padding:12px 20px;border:none;border-radius:var(--rad);font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.mbtn.pri{background:var(--acc);color:#fff;box-shadow:0 2px 8px rgba(91,155,213,.3)}.mbtn.pri:hover{background:#4582BD}
.mbtn.sec{background:var(--bg);color:var(--t1);border:1px solid var(--brd)}
.pamt{text-align:center;padding:18px;background:var(--bg);border:1px solid var(--brd);border-radius:var(--rad);margin-bottom:16px}
.pamt .l{font-size:12px;color:var(--t2);font-weight:600}.pamt .v{font-size:32px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--acc2)}
.chg{text-align:center;padding:12px;background:#EAF4EC;border:1px solid rgba(46,125,50,.25);border-radius:var(--rad);margin-top:12px}
.chg .l{font-size:12px;color:var(--ok);font-weight:600}.chg .v{font-size:26px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--ok)}

/* RECEIPT */
.rcpt{background:#fff;color:#111;padding:22px;border:1px solid var(--brd);border-radius:var(--rad);font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;max-height:55vh;overflow-y:auto}
.rcpt .sh{text-align:center;border-bottom:1px dashed #D3C9BC;padding-bottom:10px;margin-bottom:10px}
.rcpt .sh h3{font-size:15px;font-weight:800}.rcpt .sh p{font-size:10px;color:#666}
.rcpt .bi{border-bottom:1px dashed #D3C9BC;padding-bottom:8px;margin-bottom:8px;font-size:10px}
.rcpt table{width:100%;border-collapse:collapse;margin-bottom:10px}
.rcpt th{font-size:9px;text-align:left;border-bottom:1px solid #E0D7CC;padding:3px 2px;color:#555}
.rcpt td{padding:3px 2px;font-size:10px}.rcpt .r{text-align:right}
.rcpt .ts{border-top:1px dashed #D3C9BC;padding-top:8px}
.rcpt .ts .rw{display:flex;justify-content:space-between;font-size:10px;padding:1px 0}
.rcpt .ts .gr{font-size:15px;font-weight:800;border-top:1.5px solid #111;margin-top:4px;padding-top:4px}
.rcpt .pi{border-top:1px dashed #D3C9BC;padding-top:6px;margin-top:6px;font-size:10px}
.rcpt .ft{text-align:center;border-top:1px dashed #D3C9BC;padding-top:8px;margin-top:10px;font-size:11px;color:#666}
.prbtn{width:100%;padding:13px;background:var(--acc);color:#fff;border:none;border-radius:var(--rad);font-size:14px;font-weight:700;margin-top:12px;box-shadow:0 2px 8px rgba(91,155,213,.3)}
.dnbtn{width:100%;padding:10px;background:var(--bg);color:var(--t1);border:1px solid var(--brd);border-radius:var(--rad);font-size:13px;font-weight:600;margin-top:6px}

/* SEARCH RESULTS */
.sres{position:absolute;top:100%;left:0;right:60px;background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rad);max-height:260px;overflow-y:auto;z-index:100;box-shadow:0 10px 30px rgba(43,38,34,.12);margin-top:4px}
.sri{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--brd)}
.sri:hover{background:#A8CDE8}.sri:last-child{border-bottom:none}
.sri .sn{font-weight:700;font-size:13px;color:var(--t1)}.sri .sm{font-size:11px;color:var(--t2);margin-top:2px}
.sri .sp{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--acc2);font-size:13px}

/* HELD */
.hbi{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border:1px solid var(--brd);border-radius:var(--rad);margin-bottom:6px;cursor:pointer;transition:all .15s}
.hbi:hover{border-color:var(--acc);background:rgba(168,205,232,.15)}
.hbi h4{font-size:13px;font-weight:700;color:var(--t1)}.hbi p{font-size:11px;color:var(--t2);margin-top:2px}
.hbi .bt{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--acc2)}

/* TOAST */
.toast{position:fixed;top:14px;right:14px;padding:11px 20px;border-radius:var(--rad);font-size:13px;font-weight:600;z-index:2000;animation:tsin .3s ease;box-shadow:0 8px 24px rgba(43,38,34,.15)}
@keyframes tsin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.toast.s{background:var(--ok);color:#fff}.toast.e{background:var(--err);color:#fff}.toast.w{background:var(--warn);color:#fff}
@media print{.billing,.mov{display:none!important}.rcpt{position:fixed;inset:0;max-height:none;border-radius:0;border:none;box-shadow:none}}
</style>
</head>

// PERSISTENCE ENGINE
// ══════════════════════════════════════
const STORAGE_KEY = 'SUPERMART_DATA_V1';

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      // Merge saved data into DB
      Object.assign(DB, data);
    }
  } catch (e) {
    console.error('Failed to load data:', e);
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  } catch (e) {
    console.error('Failed to save data:', e);
    toast('💾 Storage Error: Browser storage full?', 'e');
  }
}

loadData(); // Load on start

// ══════════════════════════════════════
// APP STATE & RENDER ENGINE
// ══════════════════════════════════════
let state = {
  screen: 'login', cashier: null, error: '',
  txn: null, items: [], customer: null, coupon: null,
  scanInput: '', searchResults: [],
  modal: null, // 'cash','card','upi','split','customer','coupon','receipt','held'
  receiptData: null, toast: null, tendered: ''
};

function setState(upd) {
  Object.assign(state, typeof upd === 'function' ? upd(state) : upd);
  render();
}

function fp(n) { return '₹' + (n || 0).toFixed(2); }
function now() { return new Date(); }
function fmtT(d) { return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function fmtD(d) { return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }

function genBill() {
  DB.txnCounter++;
  const d = now().toISOString().slice(0,10).replace(/-/g,'');
  return `SM-${d}-${String(DB.txnCounter).padStart(4,'0')}`;
}

function recalc() {
  let sub = 0, tax = 0;
  state.items.forEach(i => { sub += i.unit_price * i.quantity; tax += i.tax; });
  let disc = state.txn.total_discount || 0;
  if (state.coupon) {
    if (state.coupon.type === 'percent') disc = Math.min(sub * state.coupon.value / 100, state.coupon.max_discount || Infinity);
    else disc = state.coupon.value;
    if (sub < state.coupon.min_bill) disc = 0;
  }
  state.txn.subtotal = Math.round(sub * 100) / 100;
  state.txn.total_discount = Math.round(disc * 100) / 100;
  state.txn.tax_amount = Math.round(tax * 100) / 100;
  state.txn.grand_total = Math.max(0, Math.round((sub - disc + tax) * 100) / 100);
}

function newBill() {
  setState({
    txn: { id: Date.now(), bill_number: genBill(), subtotal:0, total_discount:0, tax_amount:0, grand_total:0 },
    items: [], customer: null, coupon: null, scanInput: '', searchResults: []
  });
}

function toast(msg, t='s') {
  setState({ toast: { msg, t } });
  setTimeout(() => setState({ toast: null }), 2500);
}

// ══════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════
function doLogin(code, pin) {
  const c = DB.cashiers.find(x => x.employee_code === code && x.pin === pin);
  if (!c) { setState({ error: 'Invalid credentials' }); return; }
  setState({ screen: 'billing', cashier: c, error: '' });
  newBill();
}

function addProduct(prod) {
  const existing = state.items.find(i => i.product_id === prod.id);
  if (existing) {
    existing.quantity++;
    existing.tax = Math.round(prod.selling_price * existing.quantity * prod.tax_rate / 100 * 100) / 100;
    existing.line_total = Math.round((prod.selling_price * existing.quantity + existing.tax) * 100) / 100;
  } else {
    const tax = Math.round(prod.selling_price * prod.tax_rate / 100 * 100) / 100;
    state.items.push({
      id: Date.now(), product_id: prod.id, product_name: prod.name,
      sku: prod.sku, hsn_code: prod.hsn_code, tax_rate: prod.tax_rate,
      quantity: 1, unit_price: prod.selling_price, tax, line_total: Math.round((prod.selling_price + tax) * 100) / 100
    });
  }
  recalc();
  setState({ scanInput: '', searchResults: [] });
  toast('✅ ' + prod.name + ' added');
}

function handleScan(val) {
  if (!val) return;
  const byBarcode = DB.products.find(p => p.barcode === val);
  if (byBarcode) { addProduct(byBarcode); return; }
  const results = DB.products.filter(p =>
    p.name.toLowerCase().includes(val.toLowerCase()) ||
    p.sku.toLowerCase().includes(val.toLowerCase()) ||
    p.barcode.includes(val)
  );
  if (results.length === 1) addProduct(results[0]);
  else if (results.length > 1) setState({ searchResults: results });
  else toast('Item not found', 'e');
}

function updateQty(itemId, delta) {
  const item = state.items.find(i => i.id === itemId);
  if (!item) return;
  const prod = DB.products.find(p => p.id === item.product_id);
  item.quantity += delta;
  if (item.quantity <= 0) { state.items = state.items.filter(i => i.id !== itemId); }
  else {
    item.tax = Math.round(prod.selling_price * item.quantity * prod.tax_rate / 100 * 100) / 100;
    item.line_total = Math.round((prod.selling_price * item.quantity + item.tax) * 100) / 100;
  }
  recalc(); setState({});
}

function voidItem(itemId) {
  state.items = state.items.filter(i => i.id !== itemId);
  recalc(); setState({}); toast('Item voided', 'w');
}

function holdBill() {
  if (state.items.length === 0) return;
  DB.heldBills.push({ txn: { ...state.txn }, items: [...state.items], customer: state.customer, coupon: state.coupon });
  toast('🔒 Bill held'); newBill();
}

function recallBill(idx) {
  const bill = DB.heldBills[idx];
  DB.heldBills.splice(idx, 1);
  if (state.items.length > 0) DB.heldBills.push({ txn: { ...state.txn }, items: [...state.items], customer: state.customer, coupon: state.coupon });
  setState({ txn: bill.txn, items: bill.items, customer: bill.customer, coupon: bill.coupon, modal: null });
  toast('📋 Bill recalled');
}

function applyCoupon(code) {
  const c = DB.coupons.find(x => x.code === code);
  if (!c) { toast('Invalid coupon code', 'e'); return; }
  if (state.txn.subtotal < c.min_bill) { toast(`Min bill ₹${c.min_bill} required`, 'e'); return; }
  state.coupon = c; recalc();
  setState({ modal: null }); toast('🏷️ Coupon ' + code + ' applied!');
}

function removeCoupon() { state.coupon = null; state.txn.total_discount = 0; recalc(); setState({}); toast('Coupon removed'); }

function linkCustomer(phone) {
  const c = DB.customers.find(x => x.phone.includes(phone));
  if (!c) { toast('Customer not found', 'e'); return; }
  setState({ customer: c, modal: null }); toast('👤 ' + c.name + ' linked');
}

function processPayment(method, tendered) {
  const t = state.txn;
  const change = method === 'cash' ? Math.max(0, (parseFloat(tendered) || 0) - t.grand_total) : 0;
  const payments = [{ method, amount: t.grand_total, tendered: parseFloat(tendered) || t.grand_total, change }];
  
  // Record sale
  const saleEntry = {
    id: t.id,
    bill_number: t.bill_number,
    timestamp: now().toISOString(),
    cashier_id: state.cashier.id,
    customer_id: state.customer ? state.customer.id : null,
    items: state.items.map(i => ({ ...i })),
    subtotal: t.subtotal,
    discount: t.total_discount,
    tax: t.tax_amount,
    total: t.grand_total,
    payments
  };
  DB.sales.push(saleEntry);

  // Update Stock & Loyalty
  state.items.forEach(item => {
    const p = DB.products.find(x => x.id === item.product_id);
    if (p) p.stock_qty = Math.max(0, p.stock_qty - item.quantity);
  });

  if (state.customer) {
    const pts = Math.floor(t.grand_total / 100);
    const cust = DB.customers.find(c => c.id === state.customer.id);
    if (cust) cust.loyalty_points += pts;
  }

  saveData(); // Persist all changes

  setState({
    modal: 'receipt',
    receiptData: {
      store: { name: 'SUPERMART RETAIL PVT LTD', address: '123, MG Road, Bengaluru - 560001', gstin: '29AABCS1234A1Z5' },
      bill_number: t.bill_number, date: now().toLocaleString('en-IN'),
      cashier: state.cashier, customer: state.customer, items: state.items,
      subtotal: t.subtotal, discount: t.total_discount, coupon: state.coupon,
      tax: t.tax_amount, grand_total: t.grand_total, payments,
      loyalty_earned: state.customer ? Math.floor(t.grand_total / 100) : 0
    }
  });
}

      </div>
      <button class="prbtn" onclick="printReceipt()">🖨️ Print Receipt</button>
      <button class="dnbtn" onclick="closeReceipt()">✅ Done — New Bill</button>
    </div></div>`;
  }
  return '';
}

function renderToast() {
  if (!state.toast) return '';
  return `<div class="toast ${state.toast.t}">${state.toast.msg}</div>`;
}

function closeReceipt() { setState({ modal: null, receiptData: null }); newBill(); }

function printReceipt() {
  const w = window.open('','','width=400,height=600');
  w.document.write('<html><head><title>Receipt</title><style>body{font-family:monospace;font-size:12px;padding:20px;max-width:350px;margin:0 auto}table{width:100%;border-collapse:collapse}td,th{padding:2px 4px;text-align:left;font-size:11px}th{border-bottom:1px solid #000}.r{text-align:right}hr{border:none;border-top:1px dashed #000;margin:8px 0}</style></head><body>'+document.getElementById('receiptContent').innerHTML+'</body></html>');
  w.document.close(); w.print(); w.close();
}

function handleSearchInput(val) {
  state.scanInput = val;
  if (val.length >= 2) {
    const results = DB.products.filter(p => p.name.toLowerCase().includes(val.toLowerCase()) || p.sku.toLowerCase().includes(val.toLowerCase()) || p.barcode.includes(val));
    state.searchResults = results.slice(0, 12);
  } else { state.searchResults = []; }
  render();
  const inp = document.getElementById('scanInp');
  if (inp) { inp.focus(); inp.setSelectionRange(val.length, val.length); }
}

// Clock
setInterval(() => { const el = document.getElementById('clk'); if (el) el.textContent = fmtT(now()); }, 1000);

// Initial render
render();
setTimeout(() => { const el = document.getElementById('lcode'); if (el) el.focus(); }, 100);
</script>
</body>
</html>
